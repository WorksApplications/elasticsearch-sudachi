plugins {
    id 'com.diffplug.spotless'
    id 'java-library'
    id 'maven-publish'
    id 'signing'

    id 'com.worksap.nlp.sudachi.es.extension'
    id 'com.worksap.nlp.sudachi.es.dependencies'
    id 'com.worksap.nlp.sudachi.esc'
}

group = 'com.worksap.nlp'
version = properties["pluginVersion"]
description = "Plugin interface for Sudachi search engine integrations (ElasticSearch and OpenSearch)"

dependencies {
    api('com.worksap.nlp:sudachi:0.7.4')
}

spotless {
    ratchetFrom 'origin/es-8.10-8.17'
    encoding 'UTF-8' // all formats will be interpreted as UTF-8
    def formatter = rootProject.projectDir.toPath().resolve(".formatter")

    format 'misc', {
        target '*.gradle', '*.md', '.gitignore', '*.txt', '*.csv'

        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
    java {
        // don't need to set target, it is inferred from java
        // check version: https://github.com/diffplug/spotless/blob/main/plugin-gradle/CHANGES.md
        eclipse('4.35').configFile(formatter.resolve('eclipse-formatter.xml'))
        licenseHeaderFile(formatter.resolve('license-header'))
    }
}

java {
    def jvmVer = sudachiEs.jvmVersion()
    def javaVer = jvmVer == 21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17
    sourceCompatibility = javaVer
    targetCompatibility = javaVer
    withJavadocJar()
    withSourcesJar()
}

// For OpenSearch 3.0+, we need to tell Gradle that JDK 21+ libraries are compatible
if (sudachiEs.jvmVersion() >= 21) {
    configurations.all {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, sudachiEs.jvmVersion())
        }
    }
}

tasks.named('jar', Jar) {
    archiveBaseName.set("sudachi-search-spi")
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)

            pom {
                artifactId = 'sudachi-search-spi'
                url = "https://github.com/WorksApplications/elasticsearch-sudachi"
                name = 'sudachi-search-spi'
                description = project.description

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }

                developers {
                    developer {
                        id = 'kazuma-t'
                        name = 'Kazuma TAKAOKA'
                        email = 'takaoka_k@worksap.co.jp'
                        timezone = 'Asia/Tokyo'
                    }
                }

                scm {
                    connection = 'scm:git:https://github.com/WorksApplications/elasticsearch-sudachi.git'
                    developerConnection = 'scm:git:ssh://git@github.com:WorksApplications/elasticsearch-sudachi.git'
                    url = 'https://github.com/WorksApplications/elasticsearch-sudachi'
                }

                issueManagement {
                    system = 'Github Issues'
                    url = 'https://github.com/WorksApplications/elasticsearch-sudachi/issues'
                }
            }
        }
    }
}

signing {
    def signingKey = project.findProperty("gpg.key") ?: System.getenv("MAVEN_GPG_PRIVATE_KEY")
    def signingPassword = project.findProperty("gpg.password") ?: System.getenv("MAVEN_GPG_PASSPHRASE")
    useInMemoryPgpKeys(signingKey, signingPassword)
    required = !project.version.endsWith("-SNAPSHOT")
    sign publishing.publications.maven
}
