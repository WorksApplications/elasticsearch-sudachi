import org.jetbrains.kotlin.gradle.dsl.JvmTarget

plugins {
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
    id "org.jetbrains.kotlin.plugin.serialization" version "1.9.22"
    id 'com.diffplug.spotless'
    id 'org.sonarqube' version '4.0.0.2929'
    id("org.jetbrains.kotlinx.kover") version "0.7.0"
    id 'com.worksap.nlp.sudachi.esc'
    id 'com.worksap.nlp.sudachi.es'
}

group = 'com.worksap.nlp'
archivesBaseName = 'analysis-sudachi'
version = properties["pluginVersion"]

// JVM target is determined by engine version (OpenSearch 3.0+ requires JVM 21)
def jvmVersion = sudachiEs.jvmVersion()
def jvmTargetVersion = jvmVersion == 21 ? JvmTarget.JVM_21 : JvmTarget.JVM_17
def javaVersion = jvmVersion == 21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.release = jvmVersion
}

// For OpenSearch 3.0+, we need to tell Gradle that JDK 21+ libraries are compatible
if (jvmVersion >= 21) {
    configurations.all {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, jvmVersion)
        }
    }
}

compileKotlin {
    compilerOptions.jvmTarget.set(jvmTargetVersion)
}

compileTestKotlin {
    compilerOptions.jvmTarget.set(jvmTargetVersion)
}

dependencies {
    api(project(':spi'))
    api(project(':lucene'))
    implementation('com.worksap.nlp:sudachi:0.7.4')
    testImplementation(project(':testlib'))
    testImplementation('org.apache.logging.log4j:log4j-core:2.17.2')
    testImplementation('org.jetbrains.kotlin:kotlin-test-junit') {
        exclude(group: 'org.hamcrest')
    }
    testImplementation('org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3')
    kover(project(':integration'))
    kover(project(':lucene'))
    kover(project(':testlib'))
}

koverReport {
    defaults {
        xml {
            setReportFile(layout.buildDirectory.file("reports/jacoco/test/jacocoTestReport.xml"))
        }
    }
}

// See https://github.com/diffplug/spotless/tree/main/plugin-gradle
spotless {
    // watch for https://github.com/diffplug/spotless/issues/911 to be closed
    ratchetFrom 'origin/develop'
    encoding 'UTF-8' // all formats will be interpreted as UTF-8
    def formatter = rootProject.projectDir.toPath().resolve(".formatter")

    format 'misc', {
        target '*.gradle', '*.md', '.gitignore', '*.txt', '*.csv'

        trimTrailingWhitespace()
        indentWithSpaces(2)
        endWithNewline()
    }
    java {
        // don't need to set target, it is inferred from java
        // version list: https://github.com/diffplug/spotless/tree/main/lib-extra/src/main/resources/com/diffplug/spotless/extra/eclipse_jdt_formatter
        eclipse('4.21.0').configFile(formatter.resolve('eclipse-formatter.xml'))
        licenseHeaderFile(formatter.resolve('license-header'))
    }
    kotlin {
        // by default the target is every '.kt' and '.kts` file in the java sourcesets
        ktfmt('0.39')
        licenseHeaderFile(formatter.resolve('license-header'))
    }
}
