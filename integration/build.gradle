import de.undercouch.gradle.tasks.download.Download
import org.jetbrains.kotlin.gradle.dsl.JvmTarget

buildscript {
    def engineVersion = project.findProperty('engineVersion') ?: ''
    if (engineVersion.startsWith('os:')) {
        def osVersion = engineVersion.split(':', 2)[1]
        repositories { mavenCentral() }
        dependencies {
            classpath "org.opensearch.gradle:build-tools:${osVersion}"
        }
    }
}

plugins {
    id 'com.diffplug.spotless'
    id 'de.undercouch.download' version '5.4.0'
    id 'java-library'
    id 'org.jetbrains.kotlin.jvm'
    id 'org.jetbrains.kotlinx.kover'

    id 'com.worksap.nlp.sudachi.es.extension'
    id 'com.worksap.nlp.sudachi.es.sources'
    id 'com.worksap.nlp.sudachi.es.dependencies'
    id 'com.worksap.nlp.sudachi.es.testenv'
    id 'com.worksap.nlp.sudachi.esc'
}

group = 'com.worksap.nlp'
version = properties["pluginVersion"]

// Apply the OpenSearch java-agent plugin for OpenSearch 3.0+.
// The plugin requires an `opensearch_version` project property.
def projectKind = sudachiEs.kind.get()
if (projectKind.engine.toString() == 'OpenSearch' && projectKind.parsedVersion().ge(3, 0)) {
    ext.opensearch_version = projectKind.versionString
    apply plugin: 'opensearch.java-agent'
}

// JVM target is determined by engine version (OpenSearch 3.0+ requires JVM 21)
def jvmVersion = sudachiEs.jvmVersion()
def jvmTargetVersion = jvmVersion == 21 ? JvmTarget.JVM_21 : JvmTarget.JVM_17
def javaVersion = jvmVersion == 21 ? JavaVersion.VERSION_21 : JavaVersion.VERSION_17

java {
    sourceCompatibility = javaVersion
    targetCompatibility = javaVersion
}

tasks.withType(JavaCompile).configureEach {
    options.release = jvmVersion
}

compileKotlin {
    compilerOptions.jvmTarget.set(jvmTargetVersion)
}

compileTestKotlin {
    compilerOptions.jvmTarget.set(jvmTargetVersion)
}

// For OpenSearch 3.0+, we need to tell Gradle that JDK 21+ libraries are compatible
if (jvmVersion >= 21) {
    configurations.all {
        attributes {
            attribute(TargetJvmVersion.TARGET_JVM_VERSION_ATTRIBUTE, jvmVersion)
        }
    }
}

configurations { buildSudachiDict }

dependencies {
    buildSudachiDict (project(':spi'))
    compileOnly(project(':search'))
    compileOnly(project(':spi'))
    testCompileOnly(project(':testlib'))
    testCompileOnly(project(':subplugin'))
    testImplementation('junit:junit:4.13.1') {
        transitive = false
    }
    testImplementation('org.apache.logging.log4j:log4j-core:2.17.2')
    testImplementation('org.jetbrains.kotlin:kotlin-test-junit') {
        transitive = false
    }
}

def compileSystemDictionary = tasks.register("compileTestDictionary", JavaExec) {
    classpath = configurations.buildSudachiDict
    mainClass = "com.worksap.nlp.sudachi.dictionary.DictionaryBuilder"
    defaultCharacterEncoding = "utf-8"
    def dictRoot = rootProject.file("search/src/test/resources/dict").toPath()
    def matrixFile = dictRoot.resolve("matrix.def")
    def dataFile = dictRoot.resolve("lex.csv")
    def resultFile = buildDir.toPath().resolve("generated/dict/system.dict")
    args("-d", "test dictionary", "-m", matrixFile, "-o", resultFile, dataFile)
    inputs.file(matrixFile)
    inputs.file(dataFile)
    outputs.file(resultFile)
}

def downloadIcuPlugin = tasks.register('downloadIcuPlugin', Download.class) {
    String engineVersion = sudachiEs.engineVersion()
    if (sudachiEs.isEs()) {
        src("https://artifacts.elastic.co/downloads/elasticsearch-plugins/analysis-icu/analysis-icu-${engineVersion}.zip")
        dest(new File(project.buildDir, "cache/analysis-icu-elasticsearch-${engineVersion}.zip"))
    } else { // OpenSearch
        src("https://artifacts.opensearch.org/releases/plugins/analysis-icu/${engineVersion}/analysis-icu-${engineVersion}.zip")
        dest(new File(project.buildDir, "cache/analysis-icu-opensearch-${engineVersion}.zip"))
    }

    overwrite(false)
}

esTestEnv {
    var engineKind = sudachiEs.engineKind()
    var engineVersion = sudachiEs.engineVersion()
    def packageDir = rootDir.toPath().resolve("build/package/${version}/${engineKind}-${engineVersion}")
    bundlePath = packageDir
    systemDic = compileSystemDictionary.get().outputs.files.singleFile.toPath()
    configFile = rootProject.rootDir.toPath().resolve("lucene/src/test/resources/com/worksap/nlp/lucene/sudachi/ja/sudachi.json")
    additionalJars.add(project(":testlib").getTasksByName('jar', false).first().outputs.files.singleFile.toPath())
    addPlugin("analysis-icu", downloadIcuPlugin)
    addPlugin('sudachi-sub', project(':subplugin').getTasksByName('distZip', false).first())
}

test {
    onlyIf { ! (sudachiEs.isEs() && sudachiEs.kind.get().parsedVersion().ge(8, 9)) }
    dependsOn(
            ':stageBundle',
            compileSystemDictionary,
            ':testlib:jar',
            downloadIcuPlugin,
            ':subplugin:distZip'
    )
    // OpenSearch 3.0+ uses the Java agent security framework; Security Manager must be disabled.
    // For older versions the legacy Security Manager is still active.
    def useJavaAgent = !sudachiEs.isEs() && sudachiEs.kind.get().parsedVersion().ge(3, 0)
    systemProperty("tests.security.manager", !useJavaAgent)
    defaultCharacterEncoding = 'utf-8'
}

def distZip = tasks.register('distZip', Zip) {
    var engineKind = sudachiEs.engineKind()
    var engineVersion = sudachiEs.engineVersion()
    archiveBaseName.set("${engineKind}-${engineVersion}-${project.name}")
    from(
        project(':subplugin').packageJars.outputs.files,
        project(':subplugin').embedVersion.outputs.files,
        project(':testlib').jar.outputs.files,
    )
}

artifacts {
    archives distZip
}

spotless {
    ratchetFrom 'origin/develop'
    encoding 'UTF-8' // all formats will be interpreted as UTF-8
    def formatter = rootProject.projectDir.toPath().resolve(".formatter")

    format 'misc', {
        target '*.gradle', '*.md', '.gitignore', '*.txt', '*.csv'

        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
    java {
        // don't need to set target, it is inferred from java
        // check version: https://github.com/diffplug/spotless/blob/main/plugin-gradle/CHANGES.md
        eclipse('4.35').configFile(formatter.resolve('eclipse-formatter.xml'))
        licenseHeaderFile(formatter.resolve('license-header'))
    }
    kotlin {
        // by default the target is every '.kt' and '.kts` file in the java sourcesets
        ktfmt('0.61')
        licenseHeaderFile(formatter.resolve('license-header'))
    }
}
