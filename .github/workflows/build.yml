name: Build and test

on:
  push:
    branches:
      - develop
      - es-*
      - os-*
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - es-*
      - os-*

env:
  BRANCH_SUPPORT_MATRIX_FILE: .github/branch-support-matrix.json
  DEVELOP_ENGINE_VERSION: es:8.17.10
  DEVELOP_JAVA_VERSION: '17'
  SUDACHI_DICTIONARY_KIND: core
  SUDACHI_DICTIONARY_VERSION: 20241021

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  resolve-target:
    name: Resolve target version
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.resolve.outputs.mode }}
      target_branch: ${{ steps.resolve.outputs.target_branch }}
      matrix: ${{ steps.resolve.outputs.matrix }}
    steps:
    - uses: actions/checkout@v6
    - id: resolve
      run: |
        python3 - <<'PY'
        import json
        import os

        event_name = os.environ["GITHUB_EVENT_NAME"]
        if event_name == "pull_request":
            target_branch = os.environ["GITHUB_BASE_REF"]
        else:
            target_branch = os.environ["GITHUB_REF_NAME"]

        mode = "develop" if target_branch == "develop" else "series"
        matrix = {"include": []}

        if mode == "series":
            config = json.load(open(os.environ["BRANCH_SUPPORT_MATRIX_FILE"], encoding="utf-8"))
            entry = next((item for item in config["branches"] if item["branch"] == target_branch), None)
            if entry is None:
                raise SystemExit(f"No branch config found for {target_branch}")
            versions = entry.get("versions", [])
            if not versions:
                raise SystemExit(f"No engine versions configured for {target_branch}")

            matrix = {
                "include": [
                    {
                        "engine_version": version["engine_version"],
                        "java_version": version.get("java_version", "17"),
                        "main_job": index == 0,
                    }
                    for index, version in enumerate(versions)
                ]
            }

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write(f"mode={mode}\n")
            fh.write(f"target_branch={target_branch}\n")
            fh.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")
        PY

  series-build:
    name: Series build
    needs: [ resolve-target ]
    if: needs.resolve-target.outputs.mode == 'series'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.resolve-target.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v6
      with:
          fetch-depth: 0
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        java-version: ${{ matrix.java_version }}
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Extract version and set to github env
      run: ./gradlew -PengineVersion=${{ matrix.engine_version }} printVersionForGithubActions
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Build
      run: ./gradlew -PengineVersion=${{ matrix.engine_version }} --info clean build koverXmlReport
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Cache search engine download
      uses: actions/cache@v4
      with:
        path: build/integration/${{ env.ENGINE_KIND }}-${{ env.ENGINE_VERSION }}-linux-x86_64.tar.gz
        key: ${{ env.ENGINE_KIND }}-${{ env.ENGINE_VERSION }}
    - name: Cache dictionary download
      uses: actions/cache@v4
      with:
        path: build/integration/sudachi-dictionary-${{ env.SUDACHI_DICTIONARY_VERSION }}-${{ env.SUDACHI_DICTIONARY_KIND }}.zip
        key: sudachi-dictionary-${{ env.SUDACHI_DICTIONARY_VERSION }}-${{ env.SUDACHI_DICTIONARY_KIND }}
    - name: Integration test
      env:
        ES_KIND: ${{ env.ENGINE_KIND }}
        ES_VERSION: ${{ env.ENGINE_VERSION }}
        PLUGIN_VERSION: ${{ env.PROJ_VERSION }}
        RUN_ES_DAEMON: 1
        DIC_VERSION: ${{ env.SUDACHI_DICTIONARY_VERSION }}
        DIC_KIND: ${{ env.SUDACHI_DICTIONARY_KIND }}
      run: |
        bash test-scripts/00-install-elasticsearch.sh
        sleep 30
        python3 test-scripts/01-integration-test.py
        bash test-scripts/10-make-index.sh
        python3 test-scripts/20-put-docs.py
        python3 test-scripts/30-test-docs.py
        bash test-scripts/80-delete-index.sh
        bash test-scripts/10-make-index.sh
        python3 test-scripts/20-put-docs.py
        python3 test-scripts/30-test-docs.py
        bash test-scripts/80-delete-index.sh
        bash test-scripts/10-make-index.sh
        python3 test-scripts/20-put-docs.py
        python3 test-scripts/30-test-docs.py
        bash test-scripts/80-delete-index.sh
        bash test-scripts/10-make-index.sh
        python3 test-scripts/20-put-docs.py
        python3 test-scripts/30-test-docs.py
        bash test-scripts/80-delete-index.sh

    - name: Upload reports when failed
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: failure-reports-${{ env.ENGINE_KIND }}-${{ env.ENGINE_VERSION }}
        path: |
          build/reports
          build/integration/elasticsearch-*/logs
    - name: Upload built packages
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts-${{ env.ENGINE_KIND }}-${{ env.ENGINE_VERSION }}
        path: |
          build/distributions/*.zip
    - name: Upload SPI jar
      uses: actions/upload-artifact@v4
      if: matrix.main_job
      with:
        name: build-artifacts-spi-${{ env.ENGINE_KIND }}-${{ env.ENGINE_VERSION }}
        path: |
          spi/build/libs/sudachi-*.jar

  develop-build:
    name: Develop non-engine tests
    needs: [ resolve-target ]
    if: needs.resolve-target.outputs.mode == 'develop'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0
    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: ${{ env.DEVELOP_JAVA_VERSION }}
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
    - name: Test buildSrc
      run: ./gradlew -p buildSrc --info test
    - name: Test engine-independent modules
      run: ./gradlew -PengineVersion=${{ env.DEVELOP_ENGINE_VERSION }} --info :spi:check :lucene:test koverXmlReport
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload reports when failed
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: failure-reports-develop
        path: |
          build/reports
          lucene/build/reports
          buildSrc/build/reports
    - name: Upload SPI jar
      uses: actions/upload-artifact@v4
      if: success()
      with:
        name: build-artifacts-spi-${{ env.DEVELOP_ENGINE_VERSION }}
        path: |
          spi/build/libs/sudachi-*.jar
    - name: Publish SPI jar to maven central
      if: success() && github.event_name == 'push'
      run: ./gradlew -PengineVersion=${{ env.DEVELOP_ENGINE_VERSION }} --info publishToSonatype closeAndReleaseSonatypeStagingRepository
      env:
        GITHUB_USERNAME: GITHUB_ACTOR
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
        MAVEN_USER_PASSWORD: ${{ secrets.MAVEN_USER_PASSWORD }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
