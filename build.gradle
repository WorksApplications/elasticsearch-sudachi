plugins {
    id 'com.diffplug.spotless' version '8.4.0'
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
    id 'org.jetbrains.kotlin.jvm' version '2.3.0'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.3.0'
    id 'org.jetbrains.kotlinx.kover' version '0.9.7'
    id 'org.sonarqube' version '7.2.2.6593'

    id 'com.worksap.nlp.sudachi.es.extension'
    id 'com.worksap.nlp.sudachi.esc'
}

group = 'com.worksap.nlp'
base.archivesName = properties["pluginName"]
version = properties["pluginVersion"]

// define dependencies for kover merged report
dependencies {
    kover(project(':search'))
    kover(project(':lucene'))
    kover(project(':integration'))
    kover(project(':testlib'))
}

def embedVersion = tasks.register('embedVersion', Copy) {
    var engineKind = sudachiEs.engineKind()
    var engineVersion = sudachiEs.engineVersion()
    from 'search/src/main/extras/plugin-descriptor.properties'
    into "build/package/${version}/${engineKind}-${engineVersion}"
    expand([
            version: version,
            engineVersion: engineVersion,
            engineKind: engineKind
    ])
    inputs.property("version", version)
    inputs.property("elasticSearchVersion", engineVersion)
}

// list of projects that needs to be bundled beforehand.
def distProjects = [
    project('search'),
    project('lucene'),
    project('spi'),
]

def runtimeJarfiles(Project p) {
    p.configurations.runtimeClasspath.resolve().findAll { it.name.endsWith('.jar') }
}

def stageBundle = tasks.register('stageBundle', Copy) {
    dependsOn distProjects.collect { it.tasks.named('jar') }
    dependsOn embedVersion

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    into("build/package/${version}/${sudachiEs.engineKind()}-${sudachiEs.engineVersion()}")

    // put spi to subdir if possible
    def spiJars = new LinkedHashSet(runtimeJarfiles(project('spi')))
    spiJars.addAll(project('spi').tasks.named('jar').get().archiveFile.get().getAsFile())
    if (sudachiEs.hasPluginSpiSupport()) {
        into('spi') {
            from(spiJars)
        }
    } else {
        into('') {
            from(spiJars)
        }
    }

    // collecting root project (:search) is enough to pick sub projects (:lucene).
    into('') {
        from(project('search').tasks.named('jar').flatMap { it.archiveFile })
        def runtimeJars = new LinkedHashSet(runtimeJarfiles(project('search')))
        runtimeJars.removeAll(spiJars)
        from(runtimeJars)
    }
}

def distZip = tasks.register('distZip', Zip) {
    dependsOn stageBundle

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    var engineKind = sudachiEs.engineKind()
    var engineVersion = sudachiEs.engineVersion()
    archiveBaseName.set("${engineKind}-${engineVersion}-${base.archivesName.get()}")

    from(stageBundle.map { it.destinationDir }, 'LICENSE', 'README.md')
}

artifacts {
    archives distZip
}

// See https://github.com/diffplug/spotless/tree/main/plugin-gradle
spotless {
    ratchetFrom 'origin/os-3'
    encoding 'UTF-8' // all formats will be interpreted as UTF-8

    format 'misc', {
        target '*.gradle', '*.md', '.gitignore', '*.txt', '*.csv'

        trimTrailingWhitespace()
        leadingTabsToSpaces(2)
        endWithNewline()
    }
}

kover {
    reports {
        total {
            xml {
                xmlFile = file("$buildDir/reports/kover/xml/report.xml")
            }
        }
    }
}

tasks.named("sonar") {
    dependsOn("koverXmlReport")
}

sonar {
    properties {
        property "sonar.projectKey", "WorksApplications_elasticsearch-sudachi"
        property "sonar.organization", "worksapplications"
        property "sonar.host.url", "https://sonarcloud.io"

        property("sonar.coverage.jacoco.xmlReportPaths",
            "${project.rootDir}/build/reports/kover/xml/report.xml"
        )
    }
}

tasks.register("printVersionForGithubActions") {
    doLast {
        // https://docs.github.com/en/actions/using-workflows/workflow-commands-for-github-actions#environment-files
        var engineKind = sudachiEs.engineKind()
        var engineVersion = sudachiEs.engineVersion()
        file(System.getenv("GITHUB_ENV")).write(
                "PROJ_VERSION=${project.version}\nENGINE_VERSION=${engineVersion}\nENGINE_KIND=${engineKind}"
        )
    }
}

nexusPublishing {
    repositories {
        sonatype {
            username = project.findProperty("maven.user") ?: System.getenv("MAVEN_USERNAME")
            password = project.findProperty("maven.password") ?: System.getenv("MAVEN_USER_PASSWORD")
        }
    }
}
